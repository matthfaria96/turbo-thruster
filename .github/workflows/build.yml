name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest" && unzip -q templates.tpz && mv templates/* "$dest/"

      - name: Import and test
        run: |
          godot --headless --import
          godot --headless -s tests/test_logic.gd

      - name: Export
        run: |
          mkdir -p build/windows build/macos build/linux
          godot --headless --export-release "Windows" build/windows/TurboThruster.exe
          godot --headless --export-release "macOS" build/macos/TurboThruster.zip
          godot --headless --export-release "Linux" build/linux/TurboThruster.x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: turbo-thruster-windows
          path: build/windows
      - uses: actions/upload-artifact@v4
        with:
          name: turbo-thruster-macos
          path: build/macos
      - uses: actions/upload-artifact@v4
        with:
          name: turbo-thruster-linux
          path: build/linux
