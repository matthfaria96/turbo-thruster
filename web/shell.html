		<style>
:root {
	--bg: #03050b;
	--cyan: #59e6ff;
	--pink: #ff59d9;
	--orange: #ff8c26;
	--gold: #ffd24d;
	--text: #e8f4ff;
	--dim: #7f93b3;
	--pad-h: clamp(190px, 33dvh, 270px);
	--safe-top: env(safe-area-inset-top, 0px);
	--safe-bottom: env(safe-area-inset-bottom, 0px);
	--safe-left: env(safe-area-inset-left, 0px);
	--safe-right: env(safe-area-inset-right, 0px);
}

* {
	box-sizing: border-box;
	-webkit-tap-highlight-color: transparent;
}

html, body {
	margin: 0;
	padding: 0;
	height: 100%;
	background: var(--bg);
	color: var(--text);
	overflow: hidden;
	overscroll-behavior: none;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

#app {
	position: fixed;
	inset: 0;
	display: flex;
	flex-direction: column;
	background: var(--bg);
}

#view {
	position: relative;
	flex: 1 1 auto;
	min-height: 0;
}

#canvas {
	position: absolute;
	inset: 0;
	width: 100%;
	height: 100%;
	display: block;
	outline: none;
}

/* ---------------------------------------------------------------- touch pad */

#pad {
	display: none;
	position: relative;
	flex: 0 0 auto;
	height: calc(var(--pad-h) + var(--safe-bottom));
	padding: 8px calc(12px + var(--safe-right)) calc(10px + var(--safe-bottom)) calc(12px + var(--safe-left));
	gap: 8px 12px;
	background:
		linear-gradient(180deg, rgba(89, 230, 255, 0.10), rgba(89, 230, 255, 0) 30%),
		repeating-linear-gradient(90deg, rgba(89, 230, 255, 0.05) 0 1px, transparent 1px 24px),
		#050913;
	border-top: 1px solid rgba(89, 230, 255, 0.45);
	box-shadow: 0 -8px 24px rgba(89, 230, 255, 0.12);
}

body.match.touch #pad {
	display: grid;
	grid-template-columns: 1fr 1fr;
	grid-template-rows: 26px 1fr;
}

/* The game sits under the status bar and notch only outside a run. */
body.match.touch #view {
	margin-top: var(--safe-top);
}

#steer {
	position: relative;
	border-radius: 18px;
	border: 1px solid rgba(89, 230, 255, 0.4);
	background: radial-gradient(ellipse at center, rgba(89, 230, 255, 0.10), rgba(5, 9, 19, 0.6) 70%);
	display: flex;
	align-items: center;
	justify-content: space-between;
	padding: 0 10%;
	touch-action: none;
}

#steer::after {
	content: "";
	position: absolute;
	left: 50%;
	top: 22%;
	bottom: 22%;
	width: 1px;
	background: rgba(89, 230, 255, 0.25);
}

#steer .arrow {
	font-size: clamp(34px, 9vw, 52px);
	color: rgba(89, 230, 255, 0.45);
	text-shadow: 0 0 12px rgba(89, 230, 255, 0.3);
	transition: color 80ms, text-shadow 80ms, transform 80ms;
	pointer-events: none;
}

#steer .arrow.on {
	color: #fff;
	text-shadow: 0 0 10px var(--cyan), 0 0 24px var(--cyan);
	transform: scale(1.12);
}

#steer .knob {
	position: absolute;
	top: 50%;
	left: 50%;
	width: 54px;
	height: 54px;
	margin: -27px 0 0 -27px;
	border-radius: 50%;
	border: 2px solid rgba(255, 255, 255, 0.85);
	box-shadow: 0 0 16px var(--cyan), inset 0 0 12px rgba(89, 230, 255, 0.5);
	opacity: 0;
	transition: opacity 80ms;
	pointer-events: none;
}

#steer.active .knob {
	opacity: 1;
}

#actions {
	display: grid;
	grid-template-columns: 1fr 1fr;
	grid-template-rows: 1fr 1.25fr;
	gap: 10px;
}

.btn {
	position: relative;
	overflow: hidden;
	border-radius: 16px;
	border: 1px solid var(--c);
	background: radial-gradient(ellipse at 50% 120%, color-mix(in srgb, var(--c) 30%, transparent), rgba(5, 9, 19, 0.85) 70%);
	color: var(--text);
	font: 800 clamp(13px, 3.6vw, 17px)/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
	letter-spacing: 0.08em;
	text-shadow: 0 0 8px var(--c);
	box-shadow: 0 0 12px color-mix(in srgb, var(--c) 30%, transparent), inset 0 0 14px color-mix(in srgb, var(--c) 18%, transparent);
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 6px;
	padding: 0;
	touch-action: none;
	transition: transform 60ms, box-shadow 60ms, background 60ms;
}

.btn.down {
	transform: scale(0.95);
	background: radial-gradient(ellipse at 50% 100%, color-mix(in srgb, var(--c) 65%, transparent), rgba(5, 9, 19, 0.7) 75%);
	box-shadow: 0 0 22px var(--c), inset 0 0 22px color-mix(in srgb, var(--c) 45%, transparent);
}

.btn .fill {
	position: absolute;
	left: 0;
	bottom: 0;
	width: 100%;
	height: 0%;
	background: linear-gradient(0deg, color-mix(in srgb, var(--c) 55%, transparent), transparent);
	pointer-events: none;
}

.btn b, .btn small {
	position: relative;
	pointer-events: none;
}

.btn small {
	font-size: 12px;
	letter-spacing: 0.2em;
	color: var(--c);
}

.btn.off {
	filter: saturate(0.25) brightness(0.65);
}

.btn.ready {
	animation: ready 0.7s ease-in-out infinite alternate;
}

@keyframes ready {
	from { box-shadow: 0 0 10px var(--c); }
	to { box-shadow: 0 0 26px var(--c), 0 0 4px #fff; }
}

#b-fire { --c: var(--cyan); font-size: clamp(16px, 4.6vw, 22px); }
#b-charge { --c: #b8fbff; }
#b-bomb { --c: var(--pink); }
#b-nitro { --c: var(--orange); }

#b-pause {
	grid-column: 1 / span 2;
	justify-self: center;
	width: 72px;
	height: 26px;
	border-radius: 8px;
	border: 1px solid rgba(89, 230, 255, 0.6);
	background: #050913;
	color: var(--cyan);
	font: 800 14px/1 -apple-system, BlinkMacSystemFont, sans-serif;
	letter-spacing: 0.1em;
	touch-action: none;
}

/* Phone on its side: the run keeps the whole screen, controls float over it. */
@media (orientation: landscape) {
	body.match.touch #view {
		margin-top: 0;
	}

	body.match.touch #pad {
		position: absolute;
		inset: auto 0 0 0;
		height: 100%;
		pointer-events: none;
		background: none;
		border: 0;
		box-shadow: none;
		grid-template-columns: minmax(180px, 30vw) 1fr minmax(200px, 32vw);
		grid-template-rows: 1fr 45%;
		padding: 12px calc(16px + var(--safe-right)) calc(12px + var(--safe-bottom)) calc(16px + var(--safe-left));
	}

	body.match.touch #steer {
		grid-column: 1;
		grid-row: 2;
		pointer-events: auto;
		background: rgba(5, 9, 19, 0.28);
	}

	body.match.touch #actions {
		grid-column: 3;
		grid-row: 2;
		pointer-events: auto;
	}

	body.match.touch .btn {
		background: rgba(5, 9, 19, 0.35);
	}

	body.match.touch #b-pause {
		pointer-events: auto;
		position: absolute;
		top: 21%;
		left: calc(14px + var(--safe-left));
		width: 52px;
		height: 40px;
	}
}

/* ------------------------------------------------------- loading and tips */

#status {
	position: absolute;
	inset: 0;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 22px;
	background: radial-gradient(ellipse at 50% 40%, #0c1a33, var(--bg) 70%);
	visibility: hidden;
	z-index: 5;
}

#status-splash {
	width: min(42vw, 220px);
	height: auto;
	border-radius: 22%;
	box-shadow: 0 0 40px rgba(255, 89, 217, 0.35), 0 0 80px rgba(89, 230, 255, 0.25);
}

#status-title {
	font-weight: 900;
	font-size: clamp(22px, 7vw, 38px);
	letter-spacing: 0.12em;
	color: #fff;
	text-shadow: 0 0 10px var(--pink), 0 0 26px var(--pink);
}

#status-progress {
	width: min(70vw, 360px);
	height: 6px;
	border-radius: 3px;
	overflow: hidden;
	background: rgba(89, 230, 255, 0.15);
}

#status-bar {
	height: 100%;
	width: 0%;
	background: linear-gradient(90deg, var(--cyan), var(--pink));
	box-shadow: 0 0 12px var(--cyan);
	transition: width 120ms;
}

#status-notice {
	display: none;
	white-space: pre-line;
	max-width: 80vw;
	padding: 1rem;
	border-radius: 0.6rem;
	border: 1px solid #9b3943;
	background: #3a1d26;
	color: #f0dada;
	text-align: center;
	line-height: 1.35;
}

.toast {
	position: absolute;
	left: 50%;
	bottom: calc(18px + var(--safe-bottom));
	transform: translateX(-50%);
	width: min(92vw, 440px);
	display: none;
	align-items: center;
	gap: 12px;
	padding: 12px 14px;
	border-radius: 14px;
	border: 1px solid rgba(89, 230, 255, 0.5);
	background: rgba(5, 9, 19, 0.94);
	box-shadow: 0 0 22px rgba(89, 230, 255, 0.25);
	font-size: 14px;
	line-height: 1.35;
	z-index: 6;
}

.toast.show {
	display: flex;
}

body.match .toast {
	display: none;
}

.toast p {
	margin: 0;
	flex: 1;
}

.toast button {
	flex: 0 0 auto;
	border: 1px solid var(--cyan);
	border-radius: 10px;
	background: rgba(89, 230, 255, 0.12);
	color: #fff;
	font: 700 14px/1 -apple-system, BlinkMacSystemFont, sans-serif;
	padding: 10px 12px;
}

.toast .close {
	border-color: rgba(127, 147, 179, 0.5);
	background: none;
	color: var(--dim);
	padding: 8px 10px;
}

.share {
	display: inline-block;
	width: 14px;
	height: 16px;
	margin: 0 2px -2px;
	border: 2px solid var(--cyan);
	border-top: 0;
	border-radius: 2px;
	position: relative;
}

.share::before {
	content: "↑";
	position: absolute;
	top: -11px;
	left: 0;
	right: 0;
	text-align: center;
	color: var(--cyan);
	font-weight: 900;
	font-size: 13px;
}

		<script>
// Keep a handle on the engine's AudioContext so a tap can resume it (iOS
// suspends audio until a touch and again whenever the app goes to the background).
const ttAudioContexts = [];
['AudioContext', 'webkitAudioContext'].forEach((name) => {
	const Native = window[name];
	if (typeof Native !== 'function') {
		return;
	}
	window[name] = class extends Native {
		constructor(...args) {
			super(...args);
			ttAudioContexts.push(this);
		}
	};
});

const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const body = document.body;
	const view = document.getElementById('view');
	const canvas = document.getElementById('canvas');
	const coarse = window.matchMedia('(pointer: coarse)').matches;
	const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
		|| (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
	const standalone = window.navigator.standalone === true
		|| window.matchMedia('(display-mode: standalone)').matches
		|| window.matchMedia('(display-mode: fullscreen)').matches;
	if (coarse) {
		body.classList.add('touch');
	}

	// iOS still zooms on pinch and double tap unless told not to.
	['gesturestart', 'gesturechange', 'gestureend'].forEach((name) => {
		document.addEventListener(name, (e) => e.preventDefault(), { passive: false });
	});
	document.addEventListener('contextmenu', (e) => e.preventDefault());
	document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });

	// ------------------------------------------------------------ canvas size
	// The engine runs with canvasResizePolicy 0: the page owns the canvas size,
	// so the game can share the screen with the touch pad during a run.
	// Phones render at up to 2x for sharp text; desktops at 1x for frame rate.
	function pixelRatio() {
		if (!coarse) {
			return 1;
		}
		const cap = RATIO_STEPS[ratioStep] || 1;
		return Math.min(window.devicePixelRatio || 1, cap);
	}

	function fitCanvas() {
		const rect = view.getBoundingClientRect();
		const ratio = pixelRatio();
		const w = Math.max(1, Math.round(rect.width * ratio));
		const h = Math.max(1, Math.round(rect.height * ratio));
		if (canvas.width !== w || canvas.height !== h) {
			canvas.width = w;
			canvas.height = h;
		}
	}

	// --------------------------------------------------------------- audio
	// iPhone: Web Audio is silent with the ring/silent switch on unless the page
	// asks for "playback" audio (iOS 17+), or keeps a silent <audio> playing
	// (older iOS). Contexts also need a resume() inside a touch.
	if (navigator.audioSession) {
		try {
			navigator.audioSession.type = 'playback';
		} catch (e) {
			// Not allowed here: the silent element below still helps.
		}
	}

	let keepAlive = null;
	function silentWav() {
		const rate = 8000;
		const samples = rate / 2;
		const buffer = new ArrayBuffer(44 + samples);
		const v = new DataView(buffer);
		const text = (o, str) => [...str].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
		text(0, 'RIFF'); v.setUint32(4, 36 + samples, true); text(8, 'WAVE');
		text(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
		v.setUint32(24, rate, true); v.setUint32(28, rate, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
		text(36, 'data'); v.setUint32(40, samples, true);
		for (let i = 0; i < samples; i++) {
			v.setUint8(44 + i, 128);
		}
		return URL.createObjectURL(new Blob([buffer], { type: 'audio/wav' }));
	}

	function unlockAudio() {
		if (isIOS && !keepAlive) {
			keepAlive = new Audio(silentWav());
			keepAlive.loop = true;
			keepAlive.setAttribute('playsinline', '');
		}
		if (keepAlive && keepAlive.paused) {
			keepAlive.play().catch(() => {});
		}
		ttAudioContexts.forEach((ctx) => {
			if (ctx.state !== 'running' && ctx.state !== 'closed') {
				ctx.resume().catch(() => {});
			}
		});
	}

	['pointerdown', 'touchend', 'keydown'].forEach((name) => {
		document.addEventListener(name, unlockAudio, { capture: true, passive: true });
	});

	// ------------------------------------------------------ dynamic resolution
	// Phones start sharp (up to 2x) and step the canvas down while a run drops
	// under ~45 fps, back up when there is room. The level is kept per device.
	const RATIO_STEPS = [2, 1.7, 1.45, 1.2, 1, 0.85];
	let ratioStep = 0;
	try {
		ratioStep = Math.min(RATIO_STEPS.length - 1, Math.max(0, parseInt(localStorage.getItem('tt-ratio-step') || '0', 10) || 0));
	} catch (e) {
		ratioStep = 0;
	}
	let frameAvg = 16.7;
	let lastFrame = 0;
	let calmSince = 0;
	let changedAt = 0;

	function watchFrames(now) {
		requestAnimationFrame(watchFrames);
		if (!coarse || !body.classList.contains('match') || document.visibilityState !== 'visible') {
			lastFrame = 0;
			return;
		}
		if (lastFrame) {
			const dt = Math.min(now - lastFrame, 100);
			frameAvg += (dt - frameAvg) * 0.05;
		}
		lastFrame = now;
		if (now - changedAt < 3000) {
			return;
		}
		if (frameAvg > 22 && ratioStep < RATIO_STEPS.length - 1) {
			setRatioStep(ratioStep + 1, now);
		} else if (frameAvg < 15) {
			if (!calmSince) {
				calmSince = now;
			} else if (now - calmSince > 8000 && ratioStep > 0) {
				setRatioStep(ratioStep - 1, now);
			}
		} else {
			calmSince = 0;
		}
	}

	function setRatioStep(step, now) {
		ratioStep = step;
		changedAt = now;
		calmSince = 0;
		frameAvg = 16.7;
		try {
			localStorage.setItem('tt-ratio-step', String(step));
		} catch (e) {
			// Private mode: start sharp again next time.
		}
		fitCanvas();
	}

	requestAnimationFrame(watchFrames);

	new ResizeObserver(fitCanvas).observe(view);
	window.addEventListener('resize', fitCanvas);
	window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 250));
	fitCanvas();

	// --------------------------------------------------------- game <-> page
	function send(action, pressed, strength) {
		if (typeof window.ttInput === 'function') {
			window.ttInput(action, pressed, strength === undefined ? 1 : strength);
		}
	}

	let wakeLock = null;
	async function keepAwake(on) {
		try {
			if (on && !wakeLock && 'wakeLock' in navigator && document.visibilityState === 'visible') {
				wakeLock = await navigator.wakeLock.request('screen');
				wakeLock.addEventListener('release', () => { wakeLock = null; });
			} else if (!on && wakeLock) {
				await wakeLock.release();
				wakeLock = null;
			}
		} catch (e) {
			wakeLock = null;
		}
	}

	document.addEventListener('visibilitychange', () => {
		if (body.classList.contains('match')) {
			keepAwake(document.visibilityState === 'visible');
		}
	});

	// Called by the game when a run starts and ends.
	window.ttMatch = function (active) {
		body.classList.toggle('match', active);
		if (!active) {
			releaseAll();
			showPendingUpdate();
		}
		keepAwake(active);
		requestAnimationFrame(fitCanvas);
	};

	const bombs = document.getElementById('bombs');
	const bombBtn = document.getElementById('b-bomb');
	const nitroBtn = document.getElementById('b-nitro');
	const nitroFill = document.getElementById('nitro-fill');
	const chargeBtn = document.getElementById('b-charge');
	const chargeFill = document.getElementById('charge-fill');

	// Called by the game a few times per second: bombs left, nitro 0..1, charge 0..1.
	window.ttHud = function (count, nitro, charge) {
		bombs.textContent = '◆'.repeat(count) + '◇'.repeat(Math.max(0, 4 - count));
		bombBtn.classList.toggle('off', count === 0);
		nitroFill.style.height = Math.round(Math.min(nitro, 1) * 100) + '%';
		nitroBtn.classList.toggle('ready', nitro >= 1);
		nitroBtn.classList.toggle('off', nitro < 1);
		chargeFill.style.height = Math.round(charge * 100) + '%';
		chargeBtn.classList.toggle('ready', charge >= 1);
	};

	// ---------------------------------------------------------------- buttons
	const held = new Map(); // pointerId -> action

	// Capturing keeps a finger that slides off a button on that button; it can
	// throw when the pointer is already gone, which must not drop the press.
	function capture(el, e) {
		try {
			el.setPointerCapture(e.pointerId);
		} catch (err) {
			// The press still counts.
		}
	}

	function buzz() {
		if (navigator.vibrate) {
			navigator.vibrate(8);
		}
	}

	document.querySelectorAll('#pad [data-action]').forEach((el) => {
		const action = el.dataset.action;
		el.addEventListener('pointerdown', (e) => {
			e.preventDefault();
			capture(el, e);
			held.set(e.pointerId, action);
			el.classList.add('down');
			buzz();
			send(action, true);
		});
		const up = (e) => {
			if (held.get(e.pointerId) !== action) {
				return;
			}
			held.delete(e.pointerId);
			if (![...held.values()].includes(action)) {
				el.classList.remove('down');
				send(action, false);
			}
		};
		el.addEventListener('pointerup', up);
		el.addEventListener('pointercancel', up);
		el.addEventListener('lostpointercapture', up);
	});

	// --------------------------------------------------------------- steering
	// Slide anywhere on the pad: the further from the middle, the harder the turn.
	const steer = document.getElementById('steer');
	const knob = document.getElementById('knob');
	const arrowL = document.getElementById('arrow-l');
	const arrowR = document.getElementById('arrow-r');
	let steerId = null;
	let steerValue = 0;

	function setSteer(value) {
		const left = value < 0 ? -value : 0;
		const right = value > 0 ? value : 0;
		const prevLeft = steerValue < 0 ? -steerValue : 0;
		const prevRight = steerValue > 0 ? steerValue : 0;
		if (left !== prevLeft) {
			send('move_left', left > 0, left || 0);
		}
		if (right !== prevRight) {
			send('move_right', right > 0, right || 0);
		}
		steerValue = value;
		arrowL.classList.toggle('on', left > 0);
		arrowR.classList.toggle('on', right > 0);
	}

	function steerFrom(e) {
		const rect = steer.getBoundingClientRect();
		const dx = (e.clientX - rect.left - rect.width / 2) / (rect.width / 2);
		const clamped = Math.max(-1, Math.min(1, dx));
		knob.style.transform = `translateX(${clamped * (rect.width / 2 - 30)}px)`;
		const dead = 0.1;
		const magnitude = Math.min(1, Math.max(0, (Math.abs(clamped) - dead) / 0.55));
		setSteer(Math.round(Math.sign(clamped) * magnitude * 20) / 20);
	}

	steer.addEventListener('pointerdown', (e) => {
		e.preventDefault();
		if (steerId !== null) {
			return;
		}
		steerId = e.pointerId;
		capture(steer, e);
		steer.classList.add('active');
		buzz();
		steerFrom(e);
	});
	steer.addEventListener('pointermove', (e) => {
		if (e.pointerId === steerId) {
			steerFrom(e);
		}
	});
	const steerUp = (e) => {
		if (e.pointerId !== steerId) {
			return;
		}
		steerId = null;
		steer.classList.remove('active');
		knob.style.transform = '';
		setSteer(0);
	};
	steer.addEventListener('pointerup', steerUp);
	steer.addEventListener('pointercancel', steerUp);
	steer.addEventListener('lostpointercapture', steerUp);

	function releaseAll() {
		held.forEach((action) => send(action, false));
		held.clear();
		document.querySelectorAll('#pad .down').forEach((el) => el.classList.remove('down'));
		if (steerId !== null) {
			steerUp({ pointerId: steerId });
		}
	}

	window.addEventListener('blur', releaseAll);

	// ----------------------------------------------------------- install/PWA
	const installTip = document.getElementById('install-tip');
	const installPrompt = document.getElementById('install-prompt');
	const updateTip = document.getElementById('update-tip');

	function remembered(key) {
		try {
			return localStorage.getItem(key) === '1';
		} catch (e) {
			return false;
		}
	}

	function remember(key) {
		try {
			localStorage.setItem(key, '1');
		} catch (e) {
			// Private mode: the tip just shows again next time.
		}
	}

	if (isIOS && !standalone && !remembered('tt-install-tip')) {
		setTimeout(() => {
			if (!updateTip.classList.contains('show')) {
				installTip.classList.add('show');
			}
		}, 4000);
	}
	document.getElementById('install-close').addEventListener('click', () => {
		installTip.classList.remove('show');
		remember('tt-install-tip');
	});

	let deferredPrompt = null;
	window.addEventListener('beforeinstallprompt', (e) => {
		e.preventDefault();
		deferredPrompt = e;
		if (coarse && !remembered('tt-install-prompt') && !updateTip.classList.contains('show')) {
			installPrompt.classList.add('show');
		}
	});
	document.getElementById('install-go').addEventListener('click', async () => {
		installPrompt.classList.remove('show');
		if (deferredPrompt) {
			deferredPrompt.prompt();
			deferredPrompt = null;
		}
	});
	document.getElementById('install-skip').addEventListener('click', () => {
		installPrompt.classList.remove('show');
		remember('tt-install-prompt');
	});

	// A new build waits in the service worker; offer it between runs only.
	let waitingWorker = null;
	function showPendingUpdate() {
		if (waitingWorker && !body.classList.contains('match')) {
			installTip.classList.remove('show');
			installPrompt.classList.remove('show');
			updateTip.classList.add('show');
		}
	}
	document.getElementById('update-go').addEventListener('click', () => {
		if (waitingWorker) {
			waitingWorker.postMessage('update');
		}
	});

	function watchUpdates(registration) {
		if (!registration) {
			return;
		}
		const track = (worker) => {
			if (!worker) {
				return;
			}
			worker.addEventListener('statechange', () => {
				if (worker.state === 'installed' && navigator.serviceWorker.controller) {
					waitingWorker = worker;
					showPendingUpdate();
				}
			});
		};
		if (registration.waiting && navigator.serviceWorker.controller) {
			waitingWorker = registration.waiting;
			showPendingUpdate();
		}
		track(registration.installing);
		registration.addEventListener('updatefound', () => track(registration.installing));
		document.addEventListener('visibilitychange', () => {
			if (document.visibilityState === 'visible') {
				registration.update().catch(() => {});
			}
		});
	}

	// ------------------------------------------------------------- start up
	const statusOverlay = document.getElementById('status');
	const statusBar = document.getElementById('status-bar');
	const statusNotice = document.getElementById('status-notice');
	let initializing = true;

	function hideStatus() {
		statusOverlay.remove();
		initializing = false;
	}

	function displayFailureNotice(err) {
		console.error(err);
		let message = err instanceof Error ? err.message : (typeof err === 'string' ? err : 'Ocorreu um erro desconhecido.');
		if (err instanceof Error) {
			message = 'Não foi possível iniciar o jogo:\n' + message + lockdownHint;
		}
		statusNotice.textContent = message;
		statusNotice.style.display = 'block';
		document.getElementById('status-progress').style.display = 'none';
		statusOverlay.style.visibility = 'visible';
		initializing = false;
	}

	// What to do about each missing piece, in the player's words. Lockdown Mode on
	// iPhone turns off both WebGL and WebAssembly, the usual cause there.
	const lockdownHint = isIOS
		? '\n\nNo iPhone: use o iOS 15 ou mais novo e, se o Modo de Isolamento estiver ligado, '
			+ 'desligue-o para este site (Ajustes do Safari para turbothruster.witchmymac.com).'
		: '';
	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED }).map((m) => {
		if (m.startsWith('WebGL2')) {
			return '• Gráficos 3D (WebGL 2) desativados ou não suportados';
		}
		if (m.startsWith('Secure Context')) {
			return '• Conexão segura: abra pelo endereço https://turbothruster.witchmymac.com';
		}
		return '• ' + m;
	});
	if (typeof WebAssembly !== 'object') {
		missing.push('• WebAssembly desativado ou não suportado');
	}
	if (missing.length !== 0) {
		displayFailureNotice('Este navegador não consegue rodar o jogo:\n' + missing.join('\n') + lockdownHint);
		return;
	}

	statusOverlay.style.visibility = 'visible';
	engine.startGame({
		'onProgress': function (current, total) {
			if (initializing && current > 0 && total > 0) {
				statusBar.style.width = Math.round((current / total) * 100) + '%';
			}
		},
	}).then(() => {
		hideStatus();
		fitCanvas();
		if (GODOT_CONFIG['serviceWorker'] && 'serviceWorker' in navigator) {
			engine.installServiceWorker().then(watchUpdates).catch((err) => {
				console.warn('Service worker:', err);
			});
		}
	}, displayFailureNotice);
}());
		</script>
	</body>
</html>
